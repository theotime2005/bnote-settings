services:
  mailpit:
    image: axllent/mailpit:latest
    container_name: bnote-settings-mailpit
    ports:
      - "8025:8025" # Web UI
      - '${MAILING_MAILPIT_PORT:-1025}:1025' # SMTP
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8025 || exit 1" ]
